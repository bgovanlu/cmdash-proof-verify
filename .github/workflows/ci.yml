name: CI

# The verifier has no dependencies: the whole suite is node --test over the receipt and collector-attestation vectors.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: 'Test (vectors, library, CLI, browser build)'
        working-directory: packages/proof-verify
        run: node --test "test/*.test.js"
